<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions - AgriLink AI</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboards.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .action-btn {
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 5px;
        }

        .complete-btn {
            background: #198754;
            color: white;
        }

        .cancel-btn {
            background: #dc3545;
            color: white;
        }

        .receipt-btn {
            background: #f1f3f5;
            color: #333;
        }

        .action-btn:hover {
            opacity: 0.85;
        }

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            padding: 14px 20px;
            border-radius: 8px;
            background: #333;
            color: white;
            display: none;
            z-index: 9999;
        }

        .toast.show {
            display: block;
        }

        .toast.error {
            background: #dc3545;
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="sidebar-logo">
            AgriLink AI
        </div>

        <nav class="sidebar-nav">

            <a href="farmer-dashboard.html">
                Overview
            </a>

            <a href="farmer-market-prices.html">
                Market Prices
            </a>

            <a href="farmer-produce.html">
                My Produce
            </a>

            <a href="farmer-offers.html">
                Buyer Offers
            </a>

            <a href="farmer-transactions.html" class="active">
                Transactions
            </a>

            <a href="farmer-logistics.html">
                Logistics
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="#" id="logoutBtn">
                Log Out
            </a>
        </div>

    </aside>


    <main class="main-content">

        <header class="dashboard-header">

            <div>
                <h1>Transactions</h1>
            </div>

            <div class="header-right">

                <button id="refreshBtn" class="refresh-btn">
                    Refresh
                </button>

                <div class="user-info">

                    <div class="user-avatar" id="userAvatar">
                        F
                    </div>

                    <span id="userName">
                        Farmer
                    </span>

                </div>

            </div>

        </header>


        <section class="dashboard-content">

            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-label">
                        Total Transactions
                    </div>

                    <div class="stat-value" id="totalTransactions">
                        0
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-label">
                        Pending
                    </div>

                    <div class="stat-value pending" id="pendingTransactions">
                        0
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-label">
                        Completed
                    </div>

                    <div class="stat-value completed" id="completedTransactions">
                        0
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-label">
                        Completed Earnings
                    </div>

                    <div class="stat-value" id="completedAmount">
                        ₹0
                    </div>
                </div>

            </div>


            <div class="content-card">

                <h2>
                    Transaction History
                </h2>

                <div class="table-controls">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search buyer or crop..."
                    >

                    <select id="statusFilter">

                        <option value="all">
                            All Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Transaction</th>
                                <th>Buyer</th>
                                <th>Crop</th>
                                <th>Quantity</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Receipt</th>
                            </tr>

                        </thead>

                        <tbody id="transactionsTableBody">

                            <tr>

                                <td colspan="8"
                                    style="text-align:center;padding:30px;">

                                    Loading transactions...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>


<div id="toast" class="toast"></div>


<script src="js/farmer-transactions.js"></script>

</body>
</html>
