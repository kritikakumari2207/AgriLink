<script>


/* ==================================================
   CONFIGURATION
================================================== */

const API_BASE = 'http://localhost:5000';

const farmerId =
    Number(localStorage.getItem('agrilink_user_id'));

const farmerUser =
    localStorage.getItem('agrilink_user') || 'Farmer';

let transactions = [];


/* ==================================================
   SESSION CHECK
================================================== */

if (!farmerId) {

    alert('Farmer session not found. Please login again.');

    window.location.href = 'index.html';

}


/* ==================================================
   HELPERS
================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function formatPrice(value) {

    return '₹' +
        Number(value || 0).toLocaleString(
            'en-IN',
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


function formatDate(value) {

    if (!value) {
        return '-';
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return '-';
    }

    return date.toLocaleDateString(
        'en-IN',
        {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        }
    );

}


function statusBadge(status) {

    const normalized =
        String(status || 'pending').toLowerCase();


    if (normalized === 'completed') {

        return `
            <span class="badge badge-success">
                Completed
            </span>
        `;

    }


    if (normalized === 'cancelled') {

        return `
            <span class="badge badge-danger">
                Cancelled
            </span>
        `;

    }


    return `
        <span class="badge badge-warning">
            Pending
        </span>
    `;

}


function showToast(
    message,
    type = 'success'
) {

    const toast =
        document.getElementById('toast');

    toast.textContent = message;

    toast.className = `toast ${type}`;

    toast.style.display = 'block';


    setTimeout(() => {

        toast.style.display = 'none';

    }, 3000);

}


/* ==================================================
   RENDER TRANSACTIONS
================================================== */

function renderTransactions() {

    const tbody =
        document.getElementById(
            'transactionsTableBody'
        );


    const search =
        document.getElementById(
            'searchInput'
        )
        .value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById(
            'statusFilter'
        )
        .value;


    const filtered =
        transactions.filter(transaction => {

            const buyer =
                String(
                    transaction.buyer_name ||
                    transaction.buyer ||
                    ''
                ).toLowerCase();


            const crop =
                String(
                    transaction.crop_name ||
                    transaction.crop ||
                    ''
                ).toLowerCase();


            const status =
                String(
                    transaction.status ||
                    ''
                ).toLowerCase();


            const matchesSearch =
                !search ||
                buyer.includes(search) ||
                crop.includes(search);


            const matchesStatus =
                filter === 'all' ||
                status === filter;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    if (filtered.length === 0) {

        tbody.innerHTML = `
            <tr>

                <td colspan="8">

                    <div class="empty-state">

                        No transactions found.

                    </div>

                </td>

            </tr>
        `;

        return;

    }


    tbody.innerHTML =
        filtered.map(transaction => {

            const pending =
                String(
                    transaction.status || ''
                ).toLowerCase() === 'pending';


            return `

                <tr>

                    <td>

                        <div class="transaction-id">

                            TXN-${String(
                                transaction.id
                            ).padStart(5, '0')}

                        </div>

                        <div
                            style="
                                font-size:11px;
                                color:var(--text-muted);
                            "
                        >

                            Offer #${escapeHtml(
                                transaction.offer_id || '-'
                            )}

                        </div>

                    </td>


                    <td>

                        <strong>

                            ${escapeHtml(
                                transaction.buyer_name ||
                                transaction.buyer ||
                                'Buyer'
                            )}

                        </strong>


                        <div
                            style="
                                font-size:11px;
                                color:var(--text-muted);
                            "
                        >

                            ${escapeHtml(
                                transaction.buyer_email ||
                                ''
                            )}

                        </div>

                    </td>


                    <td>

                        <strong>

                            ${escapeHtml(
                                transaction.crop_name ||
                                transaction.crop ||
                                '-'
                            )}

                        </strong>


                        <div
                            style="
                                font-size:11px;
                                color:var(--text-muted);
                            "
                        >

                            ${escapeHtml(
                                transaction.quality ||
                                ''
                            )}

                        </div>

                    </td>


                    <td>

                        ${Number(
                            transaction.quantity || 0
                        )}

                        ${escapeHtml(
                            transaction.unit || 'kg'
                        )}

                    </td>


                    <td>

                        <span class="amount">

                            ${formatPrice(
                                transaction.amount
                            )}

                        </span>

                    </td>


                    <td>

                        ${formatDate(
                            transaction.transaction_date ||
                            transaction.created_at
                        )}

                    </td>


                    <td>

                        ${statusBadge(
                            transaction.status
                        )}

                    </td>


                    <td>

                        ${
                            pending

                            ?

                            `

                            <div class="action-group">

                                <button
                                    class="action-btn complete-btn"
                                    onclick="completeTransaction(${Number(transaction.id)})"
                                >

                                    <i
                                        data-lucide="check"
                                        style="width:14px;height:14px;"
                                    ></i>

                                    Complete

                                </button>


                                <button
                                    class="action-btn cancel-btn"
                                    onclick="cancelTransaction(${Number(transaction.id)})"
                                >

                                    <i
                                        data-lucide="x"
                                        style="width:14px;height:14px;"
                                    ></i>

                                    Cancel

                                </button>

                            </div>

                            `

                            :

                            `

                            <div class="action-group">

                                <button
                                    class="action-btn receipt-btn"
                                    onclick="printReceipt(${Number(transaction.id)})"
                                >

                                    <i
                                        data-lucide="printer"
                                        style="width:14px;height:14px;"
                                    ></i>

                                    Print Receipt

                                </button>

                            </div>

                            `
                        }

                    </td>

                </tr>

            `;

        }).join('');


    if (window.lucide) {
        lucide.createIcons();
    }

}


/* ==================================================
   LOAD STATISTICS
================================================== */

async function loadStats() {

    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/transactions/${farmerId}/stats`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to load statistics'
            );

        }


        const stats =
            data.stats || data || {};


        document.getElementById(
            'totalTransactions'
        ).textContent =
            stats.total || 0;


        document.getElementById(
            'pendingTransactions'
        ).textContent =
            stats.pending || 0;


        document.getElementById(
            'completedTransactions'
        ).textContent =
            stats.completed || 0;


        document.getElementById(
            'completedAmount'
        ).textContent =
            formatPrice(
                stats.completedAmount ||
                stats.completed_amount ||
                0
            );


    } catch (error) {

        console.error(
            'Stats error:',
            error
        );

    }

}


/* ==================================================
   LOAD TRANSACTIONS
================================================== */

async function loadTransactions() {

    const tbody =
        document.getElementById(
            'transactionsTableBody'
        );


    tbody.innerHTML = `
        <tr>

            <td
                colspan="8"
                class="loading-state"
            >

                Loading transactions...

            </td>

        </tr>
    `;


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/transactions/${farmerId}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to load transactions'
            );

        }


        /*
         * Supports:
         *
         * {
         *     transactions: [...]
         * }
         *
         * or
         *
         * [...]
         */

        if (Array.isArray(data)) {

            transactions = data;

        } else {

            transactions =
                Array.isArray(data.transactions)
                    ? data.transactions
                    : [];

        }


        renderTransactions();

        await loadStats();


    } catch (error) {

        console.error(
            'Transaction loading error:',
            error
        );


        tbody.innerHTML = `
            <tr>

                <td colspan="8">

                    <div class="empty-state">

                        <strong>
                            Failed to load transactions
                        </strong>

                        <br>

                        <small>
                            ${escapeHtml(
                                error.message
                            )}
                        </small>

                        <br><br>

                        <button
                            class="action-btn receipt-btn"
                            onclick="loadTransactions()"
                        >
                            Try Again
                        </button>

                    </div>

                </td>

            </tr>
        `;

    }

}


/* ==================================================
   PRINT RECEIPT
================================================== */

    const transaction =
        transactions.find(
            item =>
                Number(item.id) ===
                Number(transactionId)
        );


    if (!transaction) {

        showToast(
            'Transaction not found.',
            'error'
        );

        return;

    }


    const txnId =
        `TXN-${String(
            transaction.id
        ).padStart(5, '0')}`;


    const buyer =
        transaction.buyer_name ||
        transaction.buyer ||
        'Buyer';


    const buyerEmail =
        transaction.buyer_email ||
        '';


    const produce =
        transaction.crop_name ||
        transaction.crop ||
        'Produce';


    const quantity =
        Number(
            transaction.quantity || 0
        );


    const unit =
        transaction.unit ||
        'kg';


    const amount =
        Number(
            transaction.amount || 0
        );


    const date =
        formatDate(
            transaction.transaction_date ||
            transaction.created_at
        );


    const status =
        String(
            transaction.status ||
            'pending'
        );


    const quality =
        transaction.quality ||
        'Not specified';


    const pricePerUnit =
        transaction.price_per_unit ||
        transaction.offered_price ||
        (
            quantity > 0
                ? amount / quantity
                : 0
        );


    const receiptWindow =
        window.open(
            '',
            '_blank',
            'width=850,height=900'
        );


    if (!receiptWindow) {

        showToast(
            'Please allow pop-ups to print the receipt.',
            'error'
        );

        return;

    }


    const safeTxnId =
        escapeHtml(txnId);

    const safeBuyer =
        escapeHtml(buyer);

    const safeBuyerEmail =
        escapeHtml(buyerEmail);

    const safeProduce =
        escapeHtml(produce);

    const safeUnit =
        escapeHtml(unit);

    const safeDate =
        escapeHtml(date);

    const safeStatus =
        escapeHtml(
            status.charAt(0).toUpperCase() +
            status.slice(1)
        );

    const safeQuality =
        escapeHtml(quality);


    receiptWindow.document.write(`

/* ==================================================
   COMPLETE TRANSACTION
================================================== */

async function completeTransaction(transactionId) {

    const confirmed =
        confirm(
            'Mark this transaction as completed?'
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/transactions/${transactionId}/complete`,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        farmerId:Number(farmerId)
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to complete transaction'
            );

        }


        showToast(
            'Transaction completed successfully.'
        );


        await loadTransactions();


    } catch (error) {

        console.error(error);

        showToast(
            error.message,
            'error'
        );

    }

}


/* ==================================================
   CANCEL TRANSACTION
================================================== */

async function cancelTransaction(transactionId) {

    const confirmed =
        confirm(
            'Cancel this transaction?'
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/transactions/${transactionId}/cancel`,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        farmerId:Number(farmerId)
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to cancel transaction'
            );

        }


        showToast(
            'Transaction cancelled.'
        );


        await loadTransactions();


    } catch (error) {

        console.error(error);

        showToast(
            error.message,
            'error'
        );

    }

}
